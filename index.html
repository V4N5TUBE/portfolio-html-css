<!DOCTYPE html>
<html lang="pt-br">
<head>
    <!-- Configura a codificação e adapta a página a diferentes telas. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio</title>

    <!-- Conecta o arquivo responsável pela aparência da página. -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Agrupa o conteúdo principal do portfólio. -->
    <main class="apresentacao">
        <section class="apresentacao__conteudo">
            <!-- Apresenta a mensagem principal e destaca parte do título. -->
            <h1 class="apresentacao__conteudo__titulo">
                Eleve seu negócio digital a outro nível
                <strong class="titulo-destaque">com um Front-end de qualidade!</strong>
            </h1>

            <!-- Resume a apresentação profissional. -->
            <p class="apresentacao__conteudo__texto">
                Olá! Sou Vinicius Antunes, desenvolvedor Front-end com especialidade em React,
                HTML e CSS. Ajudo pequenos negócios e designers a colocarem em prática boas
                ideias. Vamos conversar?
            </p>

            <!-- Disponibiliza os links para as redes sociais. -->
            <div class="apresentacao__conteudo__links">
                <a class="apresentacao__links__link" href="https://instagram.com/vinicius._bomfim">Instagram</a>
                <a class="apresentacao__links__link" href="https://github.com/V4N5TUBE">GitHub</a>
            </div>
        </section>

        <!-- Exibe a imagem que acompanha a apresentação. -->
        <img class="apresentacao__imagem" src="imagem.png" alt="Desenvolvedora trabalhando em um notebook">
    </main>
</body>
</html>
